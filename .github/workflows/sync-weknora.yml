name: Sync and Review WeKnora

on:
  schedule:
    # 每天北京时间6:00 (UTC 22:00)
    - cron: '0 22 * * *'
  workflow_dispatch: # 允许手动触发，方便测试

jobs:
  sync_and_review:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Sync and Review Script
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }} # 可选：大模型接口地址
          MODEL: ${{ secrets.MODEL }}                     # 可选：使用的模型
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
        run: python sync_and_review.py